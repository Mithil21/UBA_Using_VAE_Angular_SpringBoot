# ?? Server ??????????????????????????????????????????????
server.port=8080

# ?? Project Loom Virtual Threads (Pillar 1) ?????????????
spring.threads.virtual.enabled=true

# H2 DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/uba_db
spring.datasource.username=uba_user
spring.datasource.password=uba_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ?? Logging ??????????????????????????????????????????????
logging.level.com.forensic.audit=DEBUG

# ?? Hyperledger Fabric Gateway (Pillar 5) ???????????????????
# Set these to real paths when connecting to a live Fabric network.
# Leave mspCertPath/mspKeyPath/tlsCertPath unset to skip Fabric in dev.
fabric.peer.endpoint=localhost:7051
fabric.msp.id=Org1MSP
fabric.channel.name=mychannel
fabric.chaincode.name=uba-audit
#fabric.peer.tlsCertPath=/path/to/tls/ca.crt
#fabric.msp.certPath=/path/to/msp/signcerts/cert.pem
#fabric.msp.keyPath=/path/to/msp/keystore/key.pem


# ── Kafka ────────────────────────────────────────────────────────────────────
# Kafka serialisation
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.group-id=uba-vae-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.properties.spring.json.trusted.packages=com.forensic.audit.*
# ── Gmail SMTP ───────────────────────────────────────────────────────────────
# Step 1: Go to your Google Account → Security → 2-Step Verification → enable it
# Step 2: Go to Security → App passwords → create one for "Mail"
# Step 3: Paste the 16-character app password below (no spaces)
# ─────────────────────────────────────────────────────────────────────────────
# Outlook SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your email
spring.mail.password=your pwd
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# hyperledger fabric
fabric.verification.interval=3600000
